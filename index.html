<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Macau Gacha — Card Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071310;
  --felt:#0b1f18;
  --gold:#d4af37; --gold2:#f0d060;
  --red:#e63946; --yellow:#f4a900; --blue:#3a7bd5; --green:#2a9d3f;
  --p1:#ff6b6b; --p2:#5db9ff;
  --ink:#f5efe0;
  --cw:168px; --ch:244px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(1100px 700px at 50% -12%, #14382a, var(--bg));
  color:var(--ink);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
}
button{font-family:inherit}

/* ---------- Header ---------- */
header{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:22px 30px 14px; max-width:1760px; margin:0 auto;
}
.brand h1{
  font-family:'Cinzel',Georgia,serif; font-weight:900;
  font-size:clamp(36px,5vw,58px); letter-spacing:3px; margin:0; line-height:1.1;
  background:linear-gradient(180deg,#f9e7a0,#d4af37 60%,#a8842a);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hud{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.pill{
  background:rgba(0,0,0,.4); border:1px solid rgba(212,175,55,.35);
  padding:10px 20px; border-radius:0; font-size:18px; font-weight:700; white-space:nowrap;
}
.icon-btn{
  background:rgba(255,255,255,.08); border:1px solid rgba(212,175,55,.35);
  border-radius:0; width:58px; height:58px; font-size:26px; cursor:pointer; color:var(--ink);
}
.icon-btn:hover{background:rgba(212,175,55,.2)}

/* ---------- Layout ---------- */
main{
  max-width:1760px; margin:0 auto;
  display:grid; grid-template-columns:1fr 470px 1fr; gap:22px;
  align-items:start; padding:14px 22px 8px;
}
@media (max-width:1500px){
  main{grid-template-columns:1fr}
}

/* ---------- Player panels ---------- */
.player-panel{
  position:relative;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(212,175,55,.28);
  border-radius:0; padding:22px 22px 18px;
  display:flex; flex-direction:column; gap:14px;
  min-height:400px;
}
.player-panel.active{
  border-color:var(--gold);
  box-shadow:0 0 20px rgba(212,175,55,.28);
}
.turn-tag{
  position:absolute; top:-14px; right:14px;
  background:linear-gradient(180deg,#f5dd7b,#d4af37); color:#3a2c00;
  font-size:17px; font-weight:900; letter-spacing:1px;
  padding:6px 15px; border-radius:0; box-shadow:0 3px 10px rgba(0,0,0,.5);
}
.p-head{display:flex; align-items:center; gap:12px}
.avatar{
  width:76px; height:76px; border-radius:0; flex-shrink:0;
  display:grid; place-items:center; font-weight:900; font-size:28px;
  border:2px solid rgba(255,255,255,.25);
}
.avatar.p0{background:linear-gradient(160deg,#d94848,#7c1d1d)}
.avatar.p1{background:linear-gradient(160deg,#3f7fd9,#1c3a6e)}
.p-name{font-weight:800; font-size:24px}
.p-cash{font-size:23px; opacity:.9}
.p-cash b{display:inline-block}
.p-cash span{font-size:17px; opacity:.7; font-weight:600}
.p-cash b.bump{animation:bump .55s ease}
.badge{
  display:inline-block; margin-top:4px; font-size:17px; font-weight:700;
  background:rgba(212,175,55,.16); border:1px solid rgba(212,175,55,.45);
  padding:5px 13px; border-radius:0;
}
.hand{
  display:flex; gap:14px; justify-content:center; align-items:center;
  padding:10px 6px; min-height:calc(var(--ch) + 16px); flex-wrap:wrap;
}
.coll-note{
  text-align:center; font-size:18px; font-weight:700; color:var(--gold2);
  background:rgba(0,0,0,.3); border-radius:0; padding:6px 12px;
  align-self:center;
}

/* ---------- Cards ---------- */
.card{
  --c:var(--red);
  width:var(--cw); height:var(--ch); flex-shrink:0;
  background:linear-gradient(180deg,#fffdf4,#f2ebd6);
  border:2px solid var(--c); border-radius:0;
  position:relative; padding:10px 7px 9px;
  display:flex; flex-direction:column; align-items:center;
  box-shadow:0 4px 10px rgba(0,0,0,.45);
  font-family:inherit; text-align:center; color:#26221a;
  transition:transform .15s ease, box-shadow .15s ease;
}
.card.red{--c:var(--red)}
.card.yellow{--c:var(--yellow)}
.card.blue{--c:var(--blue)}
.card.green{--c:var(--green)}
button.card{appearance:none; cursor:pointer}
button.card:hover:not(:disabled){transform:translateY(-5px); box-shadow:0 10px 18px rgba(0,0,0,.5)}
.card.selected{
  outline:3px solid var(--gold); transform:translateY(-9px);
  box-shadow:0 12px 22px rgba(0,0,0,.55), 0 0 16px rgba(212,175,55,.5);
}
.c-val{
  position:absolute; top:10px; left:10px; width:42px; height:42px; border-radius:0;
  background:var(--c); color:#fff; font-weight:900; font-size:24px;
  display:grid; place-items:center; box-shadow:0 2px 4px rgba(0,0,0,.35);
}
.card.yellow .c-val{color:#3d2e00}
.c-emoji{font-size:58px; margin-top:40px; line-height:1}
.c-name{font-size:17px; font-weight:800; margin-top:12px; line-height:1.25}
.c-suit{font-size:13.5px; color:#8a7f6a; margin-top:auto; font-weight:700}
.card.big{width:212px; height:306px}
.card.big .c-emoji{font-size:84px}
.card.big .c-name{font-size:20px}
.card.big .c-suit{font-size:15.5px}
.card.won{box-shadow:0 0 0 3px var(--gold), 0 0 28px 9px rgba(212,175,55,.55)}
.card.lost{filter:grayscale(.55) brightness(.72)}

.card-back{
  width:var(--cw); height:var(--ch); flex-shrink:0; border-radius:0;
  background:
    repeating-linear-gradient(45deg, rgba(212,175,55,.15) 0 6px, transparent 6px 12px),
    linear-gradient(160deg,#8c1d2c,#5c0e18 60%,#3f0810);
  border:2px solid #d4af37;
  box-shadow:0 4px 10px rgba(0,0,0,.45);
  display:grid; place-items:center;
  color:#e9c96a; font-family:'Cinzel',Georgia,serif; font-weight:900;
  font-size:38px; letter-spacing:3px;
}

/* 3D flip (reveal) */
.flip-card{width:var(--cw); height:var(--ch); perspective:1200px}
.flip-inner{
  position:relative; width:100%; height:100%;
  transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(.25,.8,.3,1.15);
  transform:rotateY(0deg);
}
.flip-inner.face-up{transform:rotateY(180deg)}
.flip-face{
  position:absolute; top:0; left:0;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
}
.flip-face.front{transform:rotateY(180deg)}
.flip-face.back{
  width:var(--cw); height:var(--ch); border-radius:0;
  background:
    repeating-linear-gradient(45deg, rgba(212,175,55,.15) 0 6px, transparent 6px 12px),
    linear-gradient(160deg,#8c1d2c,#5c0e18 60%,#3f0810);
  border:2px solid #d4af37;
  box-shadow:0 4px 10px rgba(0,0,0,.45);
  display:grid; place-items:center;
  color:#e9c96a; font-family:'Cinzel',Georgia,serif; font-weight:900;
  font-size:38px; letter-spacing:3px;
}

/* ---------- Table ---------- */
#table{
  background:
    radial-gradient(ellipse at 50% 28%, rgba(40,110,80,.45), rgba(8,26,20,.92)),
    repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0 10px, transparent 10px 20px);
  border:1px solid rgba(212,175,55,.35); border-radius:0;
  padding:28px 22px 24px;
  display:flex; flex-direction:column; gap:20px;
  box-shadow:inset 0 0 70px rgba(0,0,0,.55);
}
.showdown{display:flex; align-items:center; justify-content:center; gap:24px; flex-wrap:wrap}
.tbl-slot{position:relative; display:grid; place-items:center; min-height:calc(var(--ch) + 26px)}
.mid{display:flex; flex-direction:column; align-items:center; gap:12px; min-width:290px}
.pot{
  display:flex; flex-direction:column; align-items:center; gap:1px;
  background:rgba(0,0,0,.38); border:1px dashed rgba(212,175,55,.55);
  border-radius:0; padding:15px 30px; font-size:18px; font-weight:700; letter-spacing:1px;
  color:var(--gold2);
}
.pot b{font-size:46px; display:inline-block}
.pot span{opacity:.7; font-size:15px; letter-spacing:2px}
.pot.bump{animation:bump .55s ease}
.status{
  font-weight:800; font-size:22px; text-align:center; min-height:2.6em;
  display:grid; place-items:center; line-height:1.4;
}
.win-tag{
  position:absolute; top:-16px; left:50%; transform:translateX(-50%) rotate(-5deg);
  background:linear-gradient(180deg,#f5dd7b,#d4af37); color:#3a2c00;
  font-size:18px; font-weight:900; letter-spacing:1px;
  padding:6px 16px; border-radius:0; box-shadow:0 3px 10px rgba(0,0,0,.5);
  z-index:3; white-space:nowrap;
}
.slot-empty{
  width:var(--cw); height:var(--ch); border:2px dashed rgba(255,255,255,.22);
  border-radius:0; display:grid; place-items:center;
  font-size:16px; opacity:.6; text-align:center; padding:6px;
}
.tie-note{text-align:center; font-size:16px; opacity:.65}
.actions{display:flex; justify-content:center; gap:16px; flex-wrap:wrap}

/* ---------- Buttons ---------- */
.btn{
  font:inherit; font-weight:800; border:none; border-radius:0;
  padding:17px 32px; cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, opacity .12s;
}
.btn.gold{
  background:linear-gradient(180deg,#f5dd7b,#d4af37 55%,#b8912a);
  color:#33270a; text-shadow:0 1px 0 rgba(255,255,255,.45);
  box-shadow:0 5px 16px rgba(212,175,55,.35);
}
.btn.gold:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 9px 22px rgba(212,175,55,.5)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,.35)}
.btn.ghost:hover{background:rgba(255,255,255,.07)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:grayscale(.4)}
.btn.big{font-size:26px; padding:22px 46px}

/* ---------- Demo bar ---------- */
#demoBar{
  display:none;
  position:fixed; left:50%; top:128px; transform:translateX(-50%);
  z-index:40; width:min(880px, calc(100vw - 32px));
  background:rgba(8,10,18,.95); border:2px solid #d4af37;
  box-shadow:0 10px 34px rgba(0,0,0,.75), 0 0 18px rgba(212,175,55,.25);
  padding:16px 24px 20px;
}
#demoBar.show{display:block}
#demoBar .demo-head{display:flex; gap:14px; align-items:flex-start}
#demoBar #demoText{min-width:0}
.demo-toggle{
  flex-shrink:0; width:36px; height:36px; line-height:1;
  background:rgba(255,255,255,.08); border:1px solid rgba(212,175,55,.5);
  border-radius:0; color:var(--gold2); font-size:16px; font-weight:900; cursor:pointer;
}
.demo-toggle:hover{background:rgba(212,175,55,.28)}
#demoBar.collapsed{display:flex; align-items:center; gap:14px; width:auto; padding:10px 16px}
#demoBar.collapsed .demo-head{display:contents}
#demoBar.collapsed #demoText{display:none}
#demoBar.collapsed .demo-foot{margin-top:0}
#demoBar.collapsed .demo-arrow{display:none}
.demo-foot{display:flex; align-items:center; justify-content:flex-end; margin-top:12px}
#demoBar #demoText{font-size:24px; line-height:1.5; font-weight:700}
#demoBar #demoText.flash{animation:bump .5s ease}
#demoBar #demoNextBtn{flex-shrink:0; padding:12px 26px; font-size:18px}
#demoBar #demoNextBtn:not(:disabled){animation:pulse 1.2s ease infinite}
#demoBar .demo-arrow{
  position:absolute; left:50%; top:100%;
  width:0; height:0;
  border-left:18px solid transparent; border-right:18px solid transparent;
  border-top:18px solid #d4af37;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0)}
  50%{box-shadow:0 0 14px 4px rgba(212,175,55,.55)}
}

/* ---------- Modal ---------- */
#modal{position:fixed; inset:0; display:grid; place-items:center; opacity:0; pointer-events:none; transition:opacity .2s; padding:16px; background:rgba(2,8,6,.8); backdrop-filter:blur(5px); z-index:60}
#modal.show{opacity:1; pointer-events:auto}
.modal-card{
  background:linear-gradient(170deg,#143527,#0a1d15);
  border:1px solid rgba(212,175,55,.5); border-radius:0;
  padding:42px 40px; text-align:center;
  box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 6px rgba(212,175,55,.08);
  max-width:780px; width:100%; max-height:88vh; overflow-y:auto;
  animation:pop .35s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{transform:scale(.85); opacity:0} to{transform:scale(1); opacity:1}}

/* Intro & gacha & rules */
.intro-logo{
  font-family:'Cinzel',Georgia,serif; font-weight:900; font-size:58px; letter-spacing:4px;
  background:linear-gradient(180deg,#f9e7a0,#d4af37 60%,#a8842a);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:4px;
}
.intro-suits{font-size:19px; line-height:1.9; opacity:.85; margin-bottom:16px}
.intro-steps{
  text-align:left; background:rgba(0,0,0,.3); border:1px solid rgba(212,175,55,.3);
  border-radius:0; padding:18px 24px; margin:0 auto 16px; max-width:540px;
  font-size:19.5px; display:flex; flex-direction:column; gap:10px;
}
.intro-steps b{color:var(--gold2); margin-right:6px}
.intro-meta{font-size:17px; opacity:.7; margin:0 0 22px}
.modal-card .btn{margin:8px}
.gacha-head{
  font-family:'Cinzel',Georgia,serif; font-weight:900; font-size:44px; color:var(--gold2);
  letter-spacing:2px; margin-bottom:8px;
}
.modal-card .sub{opacity:.9; margin:0 0 12px; font-size:18px}
.gacha-cash{font-size:23px; margin-bottom:10px}
.gacha-note{
  font-size:19px; opacity:.85; background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.15); border-radius:0;
  padding:15px 18px; margin:0 auto 14px; max-width:580px; line-height:1.5;
}
.gacha-btns{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:8px}
.gacha-warn{color:#ffb0a0; font-size:19px; font-weight:700; margin:6px 0 0}
.gacha-new{display:flex; justify-content:center; margin:6px 0 14px}
.hand.center{justify-content:center; margin:4px 0 16px}
.modal-card h2{margin:6px 0 10px; color:var(--gold2); font-family:'Cinzel',Georgia,serif; font-size:32px}
.rules-title{margin-top:0}

/* Rules modal content */
.rules-body{text-align:left; font-size:19.5px; line-height:1.55}
.rules-body h3{
  color:var(--gold2); margin:18px 0 8px; font-size:22px;
  border-bottom:1px solid rgba(212,175,55,.3); padding-bottom:4px;
}
.rules-body p{margin:8px 0}
.rules-body ul,.rules-body ol{margin:8px 0; padding-left:26px}
.rules-body li{margin:6px 0}

/* ---------- Results ---------- */
.result-banner{text-align:center; margin-bottom:12px}
.result-banner h2{
  font-family:'Cinzel',Georgia,serif; font-size:48px; color:var(--gold2); margin:2px 0 8px;
}
.result-banner .winner-line{font-size:30px; font-weight:900; margin:10px 0 2px}
.result-banner .small{font-size:18px; opacity:.75; margin:6px 0}
.score-grid{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:14px}
.score-card{
  background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.18);
  border-radius:0; padding:18px 22px; min-width:340px; text-align:left;
}
.score-card.win{
  border-color:var(--gold); background:rgba(212,175,55,.1);
  box-shadow:0 0 18px rgba(212,175,55,.35);
}
.sc-name{font-weight:900; font-size:23px; margin-bottom:6px}
.sc-name .crown{margin-left:6px}
.sc-total{font-size:44px; font-weight:900; color:var(--gold2); margin-bottom:10px}
.sc-total span{font-size:19px; opacity:.7}
.sc-row{
  display:flex; justify-content:space-between; gap:10px;
  font-size:18px; padding:5px 0; border-top:1px solid rgba(255,255,255,.1);
}
.sc-row b{color:var(--gold2)}
.sc-row.total{font-size:20px; border-top:2px solid rgba(212,175,55,.5); margin-top:4px; padding-top:7px}
.settle-strip{
  background:linear-gradient(180deg, rgba(212,175,55,.16), rgba(212,175,55,.05));
  border:1px solid rgba(212,175,55,.5); border-radius:0;
  padding:18px 24px; margin:0 auto 16px; max-width:720px;
  font-size:19.5px; line-height:1.6; font-weight:700; text-align:center;
}
.settle-strip .big{font-size:34px; color:var(--gold2); font-weight:900}
.settle-strip .final{font-size:18px; opacity:.8; font-weight:600}

/* ---------- Confetti ---------- */
#fx{position:fixed; inset:0; pointer-events:none; z-index:90; overflow:hidden}
.confetti{
  position:absolute; top:-24px; border-radius:2px;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translateY(112vh) rotate(720deg); opacity:.7}
}
@keyframes bump{
  0%{transform:scale(1)}
  30%{transform:scale(1.28); color:#8ff0a5}
  100%{transform:scale(1)}
}
</style>
</head>
<body>

<div id="fx"></div>

<header>
  <div class="brand">
    <h1>MACAU GACHA</h1>
  </div>
  <div class="hud">
    <div class="pill" id="roundPill">Round 1 / 5</div>
    <button class="icon-btn" id="soundBtn" data-action="sound" title="Toggle sound">🔊</button>
    <button class="icon-btn" data-action="rules" title="How to Play">📖</button>
  </div>
</header>

<main>
  <section class="player-panel" id="panel0"></section>
  <section id="table"></section>
  <section class="player-panel" id="panel1"></section>
</main>

<div id="demoBar">
  <div class="demo-head">
    <button class="demo-toggle" data-action="demo-toggle" title="Collapse / expand notes">▾</button>
    <div id="demoText"></div>
  </div>
  <div class="demo-foot">
    <button class="btn gold" id="demoNextBtn" data-action="demo-next" disabled>Next ➜</button>
  </div>
  <div class="demo-arrow"></div>
</div>
<div id="modal"></div>

<script>
'use strict';
/* ================================================================
   MACAU GACHA — A Macau cultural card duel
   with a simulated gacha economy. Educational only.
   ================================================================ */

/* ---------------- Constants & card data ---------------- */
const START_CASH = 800;    // buy-in: $80 (simulated) -> 800 pts per player
const GACHA_COST = 50;     // cost of one gacha pull ($5)
const HAND_LIMIT = 3;      // max cards in hand
const TOTAL_ROUNDS = 5;

// Fixed-Limit antes: Rounds 1-2 are cheap ($10), Rounds 3-5 are expensive ($20).
// The 5 antes sum to exactly the 800-pt bankroll, so only Gacha spending can break you.
function anteFor(n){ return n <= 2 ? 100 : 200; }
function sumAntes(from, to){
  let s = 0;
  for (let r = from; r <= to; r++) s += anteFor(r);
  return s;
}

const CARD_DATA = {
  red: [
    ["Red Envelope","🧧"], ["Firecracker","🧨"], ["Paper Lantern","🏮"],
    ["Tangerine Tree","🍊"], ["Lion Dance","🦁"], ["Dragon Boat Race","🛶"],
    ["Festival Drum","🥁"], ["Fireworks Display","🎆"], ["Dragon Dance","🐉"],
    ["Drunken Dragon Parade","🐲"], ["A-Ma Festival Procession","⛩️"], ["Lunar New Year Gala","🎊"]
  ],
  yellow: [
    ["Almond Cookie","🍪"], ["Pork Chop Bun","🍔"], ["Egg Tart","🥧"],
    ["Beef Jerky","🥓"], ["Serradura Pudding","🍮"], ["Crab Congee","🦀"],
    ["Minchi","🍛"], ["African Chicken","🍗"], ["Portuguese Seafood Rice","🥘"],
    ["Cha Gordo Tea Feast","🫖"], ["Dim Sum Feast","🥟"], ["Imperial Banquet","🍲"]
  ],
  blue: [
    ["Hac Sa Beach","🏖️"], ["Coloane Village","🏡"], ["Taipa Houses","🏘️"],
    ["St. Dominic's Church","⛪"], ["Senado Square","🛕"], ["A-Ma Temple","🏯"],
    ["Guia Fortress & Lighthouse","🗼"], ["Macau Tower","🌉"], ["Ruins of St. Paul's","🏛️"],
    ["Kun Iam Statue","🗽"], ["Grand Lisboa Skyline","🌃"], ["Historic Centre of Macau","🏰"]
  ],
  green: [
    ["Coin Pusher","🪙"], ["Claw Machine","🧸"], ["Arcade Corner","🕹️"],
    ["Karaoke Night","🎤"], ["Golden Reel","🎡"], ["VR Experience","🥽"],
    ["House of Dancing Water","💃"], ["Cotai Strip Resorts","🏨"], ["Macau Grand Prix","🏎️"],
    ["Concert Arena","🎪"], ["Mega Casino Resort","🎰"], ["High Roller Suite","🃏"]
  ]
};

const COLOR_META = {
  red:    { label: "Festive Heritage",      rank: 3, chip: "🔴" },
  yellow: { label: "Gastronomy",            rank: 2, chip: "🟡" },
  blue:   { label: "Landmarks",             rank: 1, chip: "🔵" },
  green:  { label: "Modern Entertainment",  rank: 0, chip: "🟢" }
};

const $ = id => document.getElementById(id);

const fmt$ = n => '$' + (n / 10).toLocaleString('en-US'); // simulated: 1 pt = $0.10
function pName(pi){
  if (demoMode) return 'Player ' + (pi === 0 ? 'A' : 'B');
  return aiMode ? (pi === 0 ? 'You' : 'Computer') : 'Player ' + (pi + 1);
}
function pVerb(pi, v){ return (aiMode && pi === 0 && !demoMode) ? v.replace(/s$/, '') : v; }

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function orderedDeck(){
  const d = [];
  let id = 0;
  for (const color of Object.keys(CARD_DATA)){
    CARD_DATA[color].forEach((entry, i) => {
      d.push({ id: id++, color, value: i + 1, name: entry[0], emoji: entry[1] });
    });
  }
  return d;
}

function buildDeck(){ return shuffle(orderedDeck()); }

// Demo mode: replace the shuffle with a fixed deal so every scripted moment
// happens on cue. deck.pop() takes from the end, so the pop order is reversed.
function rigDemoDeck(){
  // Deal order: p0 gets the first 3 pops, then p1 the next 3 (see newGame),
  // after which free draws alternate p0, p1 — with p0's gacha pull in between.
  const popOrder = [
    ['red', 7], ['red', 9], ['blue', 7],           // p0 initial hand
    ['green', 7], ['red', 12], ['yellow', 5],      // p1 initial hand
    ['yellow', 10], ['green', 6],                  // R1 free draws (p0, p1)
    ['yellow', 11], ['blue', 8],                   // R2 free draws
    ['yellow', 3], ['blue', 3],                    // R3 free draws
    ['blue', 10],                                  // p0's R3 gacha pull
    ['green', 2], ['blue', 4], ['green', 3], ['blue', 5] // R4-5 free draws
  ];
  const all = orderedDeck();
  const take = ([color, value]) => {
    const i = all.findIndex(c => c.color === color && c.value === value);
    return all.splice(i, 1)[0];
  };
  const tail = popOrder.map(take);
  return all.concat(tail.slice().reverse());
}

function makePlayer(){

function ensureAudio(){
  if (!soundOn) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!actx) actx = new AC();
  if (actx.state === 'suspended') actx.resume();
}

function tone(freq, dur, type, vol, delay){
  if (!soundOn || !actx) return;
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + 0.03);
}

/* ---------------- Card comparison ---------------- */
function compare(a, b){
  if (a.value !== b.value) return a.value > b.value ? 1 : 2;
  if (COLOR_META[a.color].rank === COLOR_META[b.color].rank) return 0; // exact tie (shouldn't happen)
  return COLOR_META[a.color].rank > COLOR_META[b.color].rank ? 1 : 2;
}

/* ---------------- Scoring ---------------- */
function collectionOf(p){
  const cnt = {};
  p.hand.forEach(c => { cnt[c.color] = (cnt[c.color] || 0) + 1; });
  const best = Math.max(0, ...Object.values(cnt));
  return best >= 3 ? 9 : (best === 2 ? 4 : 0);
}

function scoreOf(p){
  const cash = Math.floor(p.cash / 100);
  const coll = collectionOf(p);
  const rat = p.gachas === 0 ? 5 : 0;
  return { cash, coll, rat, total: cash + coll + rat };
}

function collDesc(p){
  const cnt = {};
  p.hand.forEach(c => { cnt[c.color] = (cnt[c.color] || 0) + 1; });
  const best = Math.max(0, ...Object.values(cnt));
  if (best >= 3){
    const col = Object.keys(cnt).find(k => cnt[k] >= 3);
    return "3× " + COLOR_META[col].chip + " " + COLOR_META[col].label;
  }
  if (best === 2){
    const col = Object.keys(cnt).find(k => cnt[k] === 2);
    return "2× " + COLOR_META[col].chip + " " + COLOR_META[col].label;
  }
  return "no matching suits";
}

function beginRound(n){
  round = n;
  const a = anteFor(n);
  // Bankruptcy check: can't pay this round's ante?
  const broke = [players[0].cash < a, players[1].cash < a];
  if (broke[0] || broke[1]){
    if (broke[0] && broke[1]){
      endKind = 'double';
      addLog("💸 BOTH players can't pay the " + fmt(a) + " ante — scores will decide!");
    } else {
      endKind = 'bankrupt';
      endWinner = broke[0] ? 2 : 1;
      addLog("💸 " + pName(broke[0] ? 0 : 1) + " can't pay the " + fmt(a) + " ante — BANKRUPT! " + pName(endWinner - 1) + " " + pVerb(endWinner - 1, 'wins') + "!");
    }
    endGame();
    return;
  }
  players.forEach(p => { p.played = null; });
  pendingPlay = [null, null];
  revealResolved = false; revealMsg = ''; lastWinner = 0;
  gachaNewCard = null; gachaDiscard = null;
  phase = 'p1pick';
  players[0].cash -= a; players[1].cash -= a;
  pot = a * 2;
  addLog("🪙 Round " + n + " — both players ante " + fmt(a) + " each (pot " + fmt(pot) + ").");
  render(); sfx.draw();
  if (demoMode){
    demoNote("<b>(1) FIXED ANTE</b>（Round " + n + "）：both players automatically pay " + fmt(a) + " each → pot " + fmt(pot) + ".<br>" +
      "No raising, no folding. Can't pay the ante → instant bankruptcy.<br>" +
      "Rounds 1–2: 100 pts each · Rounds 3–5: 200 pts each.");
    demoAfter(demoPlayCard);
  }
}

function onPick(pi, id){
  if (phase !== (pi === 0 ? 'p1pick' : 'p2pick')) return;
  if ((aiMode && pi === 1) || demoMode) return;
  pendingPlay[pi] = pendingPlay[pi] === id ? null : id;
  sfx.click(); render();
}

function confirmPlay(pi){
  if (pendingPlay[pi] == null) return;
  const idx = players[pi].hand.findIndex(c => c.id === pendingPlay[pi]);
  if (idx < 0) return;
  players[pi].played = players[pi].hand.splice(idx, 1)[0];
  pendingPlay[pi] = null;
  addLog("🂠 " + pName(pi) + " " + pVerb(pi, 'plays') + " a card face-down.");
  sfx.flip(); render();
  if (pi === 0){
    phase = 'p2pick'; render(); aiSchedulePlay();
  } else {
    phase = 'reveal'; render();
    setTimeout(flipReveal, 600);
  }
}

function flipReveal(){
  document.querySelectorAll('.flip-inner').forEach(el => el.classList.add('face-up'));
  sfx.flip();
  setTimeout(resolveReveal, 950);
}

function resolveReveal(){
  const c1 = players[0].played, c2 = players[1].played;
  const a = pot / 2;
  const w = compare(c1, c2);
  if (w === 0){
    players[0].cash += a; players[1].cash += a; pot = 0;
    revealMsg = "🤝 Exact tie — both antes returned!";
    lastWinner = 0;
    sfx.lose();
  } else {
    players[w - 1].cash += pot; pot = 0;
    lastWinner = w;
    const wc = w === 1 ? c1 : c2, lc = w === 1 ? c2 : c1;
    if (c1.value === c2.value){
      revealMsg = "⚔️ Tie on " + c1.value + "! Suit rank decides: " +
        COLOR_META[wc.color].chip + " " + COLOR_META[wc.color].label + " beats " +
        COLOR_META[lc.color].chip + " " + COLOR_META[lc.color].label +
        " — " + pName(w - 1) + " " + pVerb(w - 1, 'takes') + " the " + fmt(a * 2) + " pot!";
    } else {
      revealMsg = "⚔️ " + c1.name + " (" + c1.value + ") vs " + c2.name + " (" + c2.value +
        ") — " + pName(w - 1) + " " + pVerb(w - 1, 'takes') + " the " + fmt(a * 2) + " pot!";
    }
    sfx.win(); confetti(40);
  }
  discard.push(c1, c2);
  addLog(revealMsg);
  revealResolved = true;
  render();
  if (demoMode){
    const s = DEMO_SCRIPT[round - 1];
    demoNote(s && s.p0[1] === s.p1[1]
      ? "<b>(2) REVEAL</b> ：same value! Suit rank decides the tie ：Red &gt; Yellow &gt; Blue &gt; Green."
      : "<b>(2) REVEAL</b> ：the higher value wins; ties go to suit rank （Red &gt; Yellow &gt; Blue &gt; Green）.<br>" +
        "The winner takes the whole pot; played cards are discarded.");
    demoAfter(() => { if (phase === 'reveal') continueAfterReveal(); });
  }
}

function continueAfterReveal(){
  phase = 'draw';
  let drew = false;
  players.forEach(p => {
    if (deck.length && p.hand.length < HAND_LIMIT){ p.hand.push(deck.pop()); drew = true; }
  });
  addLog(drew ? "📥 Both players draw 1 free card (hand limit 3)." : "📥 Free draw skipped — deck empty.");
  render(); sfx.draw();
  phase = 'p1gacha'; render();
  if (demoMode){
    demoNote("<b>(3) FREE DRAW</b> ：each player drew 1 free card （hand limit 3）.");
    demoAfter(() => {
      if (phase !== 'p1gacha') return;
      demoNote("<b>(4) GACHA</b>（optional）：" + fmt(GACHA_COST) + " ($5) for 1 extra card, once per round.<br>" +
        "A full hand (limit 3) must discard an old card first. " + pName(0) + " goes first…");
      demoAfter(() => { if (phase === 'p1gacha') demoGacha(0); });
    });
  } else {
    openGachaModal(0);
  }
}

function gachaPick(id){

function gachaConfirm(){
  const pi = gachaPlayer, p = players[pi];
  if (gachaDiscard != null){
    const i = p.hand.findIndex(c => c.id === gachaDiscard);
    if (i >= 0){
      const gone = p.hand.splice(i, 1)[0];
      discard.push(gone);
      addLog("🗑️ " + pName(pi) + " discarded " + gone.name + " to make room.");
    }
  }

  addLog("✨ " + pName(pi) + " added " + gachaNewCard.name + " (" + gachaNewCard.value + ") to the hand.");

function gachaNo(){
  const pi = gachaPlayer;
  addLog("🚫 " + pName(pi) + " skipped the gacha.");

function gachaDone(pi){
  render();
  if (pi === 0){
    phase = 'p2gacha'; render();
    if (demoMode) demoNote("<b>GACHA</b> ：now " + pName(1) + "'s turn at the machine…");
    aiScheduleGacha();
  } else if (round >= TOTAL_ROUNDS){
    endKind = 'normal';
    if (demoMode){ demoAfter(endGame); } else { endGame(); }
  } else if (demoMode){
    demoAfter(() => beginRound(round + 1));
  } else {
    beginRound(round + 1);
  }
}

function endGame(){
  phase = 'over';
  closeModal();

  // 1) Final scoring decides the winner — computed BEFORE any points move.
  const s = [scoreOf(players[0]), scoreOf(players[1])];
  endScores = s;
  endCashBefore = [players[0].cash, players[1].cash];
  if (endKind === 'bankrupt'){
    endWinnerIdx = endWinner - 1;
  } else if (s[0].total !== s[1].total){
    endWinnerIdx = s[0].total > s[1].total ? 0 : 1;
  } else if (players[0].cash !== players[1].cash){
    endWinnerIdx = players[0].cash > players[1].cash ? 0 : 1; // tie on score → more points wins
  } else {
    endWinnerIdx = -1; // full draw
  }

  // 2) Winner takes all: the loser's remaining points are seized.
  endSeized = 0;
  if (endWinnerIdx >= 0){
    endSeized = players[1 - endWinnerIdx].cash;
    players[endWinnerIdx].cash += endSeized;
    players[1 - endWinnerIdx].cash = 0;
    addLog("💰 Winner takes all — " + pName(endWinnerIdx) + " seizes " + fmt(endSeized) + " (" + fmt$(endSeized) + ") from " + pName(1 - endWinnerIdx) + "!");
  } else {
    addLog("🤝 Draw — both keep their own points.");
  }

  if (endKind === 'bankrupt') sfx.bankrupt(); else sfx.win();
  render();
  confetti(endKind === 'normal' ? 120 : 60);
  if (demoMode){
    demoNote("<b>FINAL SCORING</b> ：every 100 pts of cash = 1 point.<br>" +
      "2 same-suit cards = 4 · 3 same-suit = 9 · never gacha'd = +5 （Rational Spender）.<br>" +
      "The score decides the winner ：not who won more pots.");
    demoAfter(() => {
      demoNote("<b>RATIONAL SPENDER</b> ：" + pName(0) + " pulled the Gacha " + players[0].gachas + "×, so no bonus. " +
        pName(1) + " never pulled all game → <b>+5</b>.<br>" +
        "Scores ：A: " + s[0].cash + " cash + " + s[0].coll + " suits + " + s[0].rat + " bonus = " + s[0].total +
        " · B: " + s[1].cash + " cash + " + s[1].coll + " suits + " + s[1].rat + " bonus = " + s[1].total + ".<br>" +
        pName(1) + " wins by never gacha'ing ：discipline beats spending.");
      demoAfter(() => {
        demoNote("<b>WINNER TAKES ALL</b> ：the higher score seizes every remaining point from the loser.<br>" +
          "Tie on score → more remaining points wins; still tied → a draw, both keep their points.<br>" +
          (endWinnerIdx >= 0
            ? "Here, " + pName(endWinnerIdx) + " walks away with everything ：" + pName(1 - endWinnerIdx) + " leaves with 0."
            : "Here it's a draw ：both keep their points."));
      });
    });
  }
}

/* ---------------- Computer opponent (Player 2) ---------------- */
function aiSchedulePlay(){

  else { aiTimer = setTimeout(aiPlayCard, 900); }

function aiPlayCard(){
  if (phase !== 'p2pick') return;
  const c = aiChooseCard(1);
  if (!c) return;
  const idx = players[1].hand.findIndex(x => x.id === c.id);
  if (idx < 0) return;
  pendingPlay[1] = null;
  players[1].played = players[1].hand.splice(idx, 1)[0];
  addLog("🂠 " + pName(1) + " " + pVerb(1, 'plays') + " a card face-down.");
  sfx.flip();
  phase = 'reveal'; render();
  if (demoMode) demoNote(pName(1) + " also played face-down ：now the simultaneous showdown!");
  setTimeout(flipReveal, 600);

function aiScheduleGacha(){
  clearTimeout(aiTimer);
  if (demoMode){ demoAfter(aiGachaDecision); }
  else { aiTimer = setTimeout(aiGachaDecision, 900); }
}

function aiGachaDecision(){
  if (phase !== 'p2gacha') return;
  const p = players[1];
  const canPay = p.cash >= GACHA_COST && deck.length > 0;
  if (canPay && aiWantGacha()){
    p.cash -= GACHA_COST; p.gachas++;
    const nc = deck.pop();
    let discNote = '';
    if (p.hand.length >= HAND_LIMIT){
      const gone = aiChooseDiscard();
      const i = p.hand.findIndex(c => c.id === gone.id);
      if (i >= 0){ p.hand.splice(i, 1)[0]; discard.push(gone); discNote = ' It discarded ' + gone.name + ' to make room.'; }
    }
    p.hand.push(nc);
    addLog("🤖 " + pName(1) + " pulled a gacha for " + fmt(GACHA_COST) + "! New card: " + nc.name + " (" + nc.value + ")." + discNote);
    sfx.gacha();
  } else {
    addLog("🤖 " + pName(1) + (canPay ? " skipped the gacha." : " can't afford the gacha."));
    if (demoMode) demoNote("<b>SKIP</b> ：" + pName(1) + " skips the Gacha. Skipping is free.<br>" +
      "Never pulling all game earns <b>+5 Rational Spender</b>.");
  }
  render();
  gachaDone(1);
}

function aiWantGacha(){
  // A gacha costs 50 pts and forfeits the +5 Rational Spender bonus, so the
  // computer mostly skips — and it never risks its ability to pay the remaining antes.
  if (demoMode){
    const s = DEMO_SCRIPT[round - 1];
    return !!(s && s.gacha[1]);
  }
  const p = players[1];
  const future = sumAntes(round + 1, TOTAL_ROUNDS) + GACHA_COST;
  if (p.cash - GACHA_COST < future) return false;
  const cnt = aiSuitCounts(p.hand);
  const hasPair = Object.values(cnt).some(n => n >= 2);
  if (hasPair && Math.random() < 0.35) return true; // chance to complete a 3-of-a-suit (+9)
  return Math.random() < 0.05;                      // rare impulse pull
}

function aiSuitCounts(hand){
  const cnt = {};
  hand.forEach(c => { cnt[c.color] = (cnt[c.color] || 0) + 1; });
  return cnt;
}

function aiWinProb(c, unknown){
  let w = 0;
  for (const u of unknown){
    if (c.value !== u.value){ if (c.value > u.value) w++; }
    else if (COLOR_META[c.color].rank > COLOR_META[u.color].rank) w++;
  }
  return w / unknown.length;
}

function aiCollCost(hand, c){
  const before = collectionOf({ hand });
  const after = collectionOf({ hand: hand.filter(x => x.id !== c.id) });
  return before - after; // suit points lost by removing this card
}

function aiChooseCard(pi){
  const p = players[pi];
  if (!p.hand.length) return null;
  if (demoMode){
    // Scripted demo: play the planned card if it is still in hand.
    const s = DEMO_SCRIPT[round - 1];
    const want = s ? (pi === 0 ? s.p0 : s.p1) : null;
    if (want){
      const c = p.hand.find(c => c.color === want[0] && c.value === want[1]);
      if (c) return c;
    }
  }
  const opp = players[1 - pi];
  const unknown = deck.concat(opp.hand, opp.played ? [opp.played] : []); // cards the AI can't see
  if (!unknown.length) return p.hand[0];
  const roundsLeft = TOTAL_ROUNDS - round + 1;
  const future = sumAntes(round + 1, TOTAL_ROUNDS) + GACHA_COST;

  // How hard the computer pushes for this pot.
  let aggression = 1;
  if (opp.cash < future) aggression = 2.2;    // winning this pot pushes the opponent to the brink
  else if (p.cash < future) aggression = 2.2; // losing this pot is close to fatal
  else if (p.cash < opp.cash) aggression = 1.2;
  else if (roundsLeft <= 1) aggression = 0.8; // protecting a lead — play safe

  let best = null, bestScore = -Infinity;
  for (const c of p.hand){
    const potEV = (2 * aiWinProb(c, unknown) - 1) * anteFor(round); // expected pts from the pot
    const collCost = aiCollCost(p.hand, c) * 180 / aggression;       // suit points are decisive at final scoring
    const retention = (roundsLeft > 1 && c.value >= 8 && aggression < 1) ? c.value * 12 : 0;
    const noise = Math.random() * 70;                                // human-like imperfection
    const score = potEV * aggression - collCost - retention + noise;
    if (score > bestScore){ bestScore = score; best = c; }
  }
  return best;
}

function aiChooseDiscard(){
  const hand = players[1].hand;
  const cnt = aiSuitCounts(hand);
  let best = null, bestScore = Infinity;
  for (const c of hand){
    const score = cnt[c.color] * 100 + c.value; // keep suits paired, drop low singletons first
    if (score < bestScore){ bestScore = score; best = c; }
  }
  return best;
}

function demoGacha(pi){

  const s = DEMO_SCRIPT[round - 1];

  if (want && p.cash >= GACHA_COST && deck.length){
    p.cash -= GACHA_COST; p.gachas++;
    const nc = deck.pop();
    let discNote = '';
    if (p.hand.length >= HAND_LIMIT){
      let i = -1;
      const dc = s.discard;
      if (dc) i = p.hand.findIndex(c => c.color === dc[0] && c.value === dc[1]);
      if (i < 0) i = 0;
      const gone = p.hand.splice(i, 1)[0];
      discard.push(gone);
      discNote = ' It discarded ' + gone.name + ' to make room.';
    }
    p.hand.push(nc);

}

}

function backHTML(){

}

function playedHTML(pi){
  const p = players[pi];
  if (!p.played) return '<div class="slot-empty">Awaiting card…</div>';

    if (revealResolved){

function renderPlayer(pi){
  const p = players[pi], panel = $('panel' + pi);
  if (!panel) return;
  const isAI = aiMode && pi === 1;

    ? p.hand.map(() => backHTML()).join('')

      '<span class="big">' + fmt(endSeized) + ' (' + fmt$(endSeized) + ')</span> seized from ' + pName(1 - wIdx) + ' by ' + pName(wIdx) + '.<br>' +

      pName(0) + ' ' + fmt(players[0].cash) + ' · ' + pName(1) + ' ' + fmt(players[1].cash) + '</div>';

  return '<div class="result-banner"><h2>' + banner + '</h2>' + sub + '</div>' +
    scoreGrid +
    settle +
    '<div class="actions">' +
      '<button class="btn gold" data-action="again">🔄 Play Again</button>' +
      '<button class="btn ghost" data-action="rules">📖 How to Play</button>' +

}

/* ---------------- Confetti ---------------- */
function confetti(n){
  const fx = $('fx');
  if (!fx) return;
  const colors = ['#d4af37', '#e63946', '#f4a900', '#3a7bd5', '#2a9d3f', '#ffffff'];
  for (let i = 0; i < n; i++){
    const d = document.createElement('i');
    d.className = 'confetti';
    d.style.left = (Math.random() * 100) + 'vw';
    d.style.background = colors[i % colors.length];
    d.style.animationDelay = (Math.random() * 0.6) + 's';
    d.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    d.style.width = (8 + Math.random() * 8) + 'px';
    d.style.height = (14 + Math.random() * 12) + 'px';
    fx.appendChild(d);
    setTimeout(() => d.remove(), 4000);
  }
}

    case 'close-rules':
      closeModal();
      if (phase === 'start') openIntro();
      break;
    case 'sound':    toggleSound(); break;
    case 'demo-next': {
      const fn = demoNext;
      if (!fn) break;
      demoNext = null; setDemoNextBtn();
      fn();
      break;
    }
    case 'demo-toggle': {
      const bar = $('demoBar');
      if (!bar) break;
      const collapsed = bar.classList.toggle('collapsed');
      const tb = bar.querySelector('.demo-toggle');
      if (tb) tb.textContent = collapsed ? '▸' : '▾';
      break;
    }
    case 'pick':
      if (phase === 'p1pick' || phase === 'p2pick'){
        onPick(phase === 'p1pick' ? 0 : 1, +btn.dataset.id);
      }
      break;
    case 'confirm-play': confirmPlay(phase === 'p1pick' ? 0 : 1); break;
    case 'reveal-continue': continueAfterReveal(); break;
    case 'gacha-yes':    gachaYes(); break;
    case 'gacha-no':     gachaNo(); break;
    case 'gacha-pick':   gachaPick(+btn.dataset.id); break;
    case 'gacha-confirm': gachaConfirm(); break;
    case 'again':        openBuyIn(); break;
  }
});

/* ---------------- Boot ---------------- */
const soundBtn = $('soundBtn');
if (soundBtn) soundBtn.textContent = soundOn ? '🔊' : '🔇';
newGame(true);
</script>
</body>
</html>
